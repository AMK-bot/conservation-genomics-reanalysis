<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720"
     role="img" aria-labelledby="title description">
  <title id="title">Phase 5B secondary hypotheses, models, and bounded outcomes</title>
  <desc id="description">The final project phase tests questions generated by the baseline work in
  a fixed order. Wolf within-population rank association, a partial generic-homozygosity control,
  bootstrap intervals, and permutations support 15 of 15 cells. Damage-aware peafowl comparisons
  retain one of four metrics. Known-truth neutral scenarios passed through the same currentNe2
  decision pipeline yield zero of fifteen resolving designs. The wolf gate opens localization, where
  observed inside-versus-outside burden is compared with 199 within-chromosome circular shifts and
  24 of 24 cohort-by-GERP cells exceed the null at 1.5 megabases. Annotation triangulation is deferred
  because no independent definition is available.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52736c"/>
    </marker>
    <style>
      .title { font: 700 31px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #173b36; }
      .kicker { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2e7567; letter-spacing: 1.1px; }
      .head { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #173b36; }
      .body { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #36534d; }
      .small { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #536b66; }
      .metric { font: 750 31px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #173b36; }
      .mono { font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #173b36; }
      .card { fill: #ffffff; stroke: #b8cbc6; stroke-width: 2; }
      .wolf { fill: #f7efe4; stroke: #c28a43; stroke-width: 2; }
      .peafowl { fill: #e8f3ef; stroke: #6ea99b; stroke-width: 2; }
      .decision { fill: #eef3f5; stroke: #7c9aa5; stroke-width: 2; }
      .arrow { fill: none; stroke: #52736c; stroke-width: 3; marker-end: url(#arrow); }
      .gate { fill: none; stroke: #a56a24; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="720" rx="28" fill="#f4f7f5"/>
  <text class="title" x="58" y="55">Phase 5B: every secondary hypothesis had to earn its boundary</text>
  <text class="kicker" x="60" y="88">PREDECLARED ORDER · SAME DATA → STRONGER TESTS → NEGATIVE, POSITIVE, OR DEFERRED OUTCOMES</text>

  <g role="group" aria-label="Wolf individual association and negative control">
    <rect class="wolf" x="55" y="122" width="450" height="214" rx="20"/>
    <text class="head" x="80" y="158">1 · Wolf association + negative control</text>
    <text class="body" x="80" y="190">Within-pop fractional ranks → Pearson association</text>
    <text class="body" x="80" y="216">Partial correlation controls generic homozygosity</text>
    <text class="body" x="80" y="242">999 cohort bootstraps · 1,999 permutations</text>
    <text class="metric" x="80" y="291">15/15 partial-load CIs &gt; 0</text>
    <text class="small" x="80" y="317">Proxy association; not fitness or causation</text>
  </g>

  <path class="arrow" d="M 505 229 L 565 229"/>

  <g role="group" aria-label="Damage-aware peafowl falsification">
    <rect class="peafowl" x="569" y="122" width="450" height="214" rx="20"/>
    <text class="head" x="594" y="158">2 · Peafowl damage falsification</text>
    <text class="body" x="594" y="190">Transversions · equal n · leave-one-out</text>
    <text class="body" x="594" y="216">462 exact label allocations</text>
    <text class="body" x="594" y="242">999 chromosome-block bootstraps</text>
    <text class="metric" x="594" y="291">1/4 metrics fully robust</text>
    <text class="small" x="594" y="317">Geography still blocks a temporal-erosion claim</text>
  </g>

  <path class="arrow" d="M 1019 229 L 1079 229"/>

  <g role="group" aria-label="Peafowl known-truth sample-design calibration">
    <rect class="peafowl" x="1083" y="122" width="462" height="214" rx="20"/>
    <text class="head" x="1108" y="158">3 · Known-truth Nₑ design calibration</text>
    <text class="body" x="1108" y="190">Wright–Fisher / Haldane scenarios</text>
    <text class="body" x="1108" y="216">5 sample sizes × 3 marker densities</text>
    <text class="body" x="1108" y="242">same currentNe2 + CI decision → Wilson bounds</text>
    <text class="metric" x="1108" y="291">0/15 resolving designs</text>
    <text class="small" x="1108" y="317">Neither prespecified truth-resolution rule was met</text>
  </g>

  <path class="gate" d="M 280 336 C 280 376, 390 370, 390 413"/>

  <g role="group" aria-label="Predeclared localization gate">
    <rect class="decision" x="55" y="414" width="340" height="156" rx="20"/>
    <text class="head" x="80" y="451">4 · Predeclared gate</text>
    <text class="metric" x="80" y="496">15/15 ≥ 12/15</text>
    <text class="head" x="80" y="532">IMPLEMENT localization</text>
    <text class="small" x="80" y="556">Authorization before outcome inspection</text>
  </g>

  <path class="gate" d="M 395 491 L 463 491"/>

  <g role="group" aria-label="Wolf spatial localization model">
    <rect class="wolf" x="467" y="377" width="657" height="230" rx="20"/>
    <text class="head" x="492" y="415">5 · Wolf localization: observed enrichment versus a spatial null</text>
    <rect x="492" y="436" width="607" height="58" rx="12" fill="#ffffff" stroke="#d6c6aa"/>
    <text class="mono" x="796" y="462" text-anchor="middle">log₂[(inside burden / inside eligible calls)</text>
    <text class="mono" x="796" y="483" text-anchor="middle">÷ (outside burden / outside eligible calls)]</text>
    <text class="body" x="492" y="526">Observed long ROH compared with 199 within-chromosome circular shifts</text>
    <text class="metric" x="492" y="572">24/24 cohort × GERP cells beyond null at 1.5 Mb</text>
    <text class="small" x="492" y="596">Spatial colocalization of proxies; eligible assayed-SNP calls are not callable bases</text>
  </g>

  <path class="arrow" d="M 1124 491 L 1180 491"/>

  <g role="group" aria-label="Independent annotation decision">
    <rect class="decision" x="1184" y="377" width="361" height="230" rx="20"/>
    <text class="head" x="1209" y="415">6 · Annotation decision</text>
    <text class="metric" x="1209" y="462">0/1 independent</text>
    <text class="body" x="1209" y="493">VEP / SIFT / GERP already tested</text>
    <text class="body" x="1209" y="518">by the source on 211/211 samples</text>
    <text class="mono" x="1209" y="558">DEFER_DUPLICATES_</text>
    <text class="mono" x="1209" y="579">SOURCE_STUDY</text>
    <text class="small" x="1209" y="600">Deferral prevents false triangulation</text>
  </g>

  <rect x="55" y="642" width="1490" height="49" rx="14" fill="#173b36"/>
  <text x="800" y="673" text-anchor="middle"
        style="font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#ffffff">
    Final lesson: support, correction, indeterminacy, and deferral are all valid scientific outcomes when the rule is frozen first.
  </text>
</svg>
