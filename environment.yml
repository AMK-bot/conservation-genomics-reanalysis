# congen — osx-64 toolchain (Apple Silicon via Rosetta).
# Use micromamba: classic conda exceeds the available memory on the 8 GB target laptop.
# Pin the solve to x86_64 so every Bioconda tool resolves:
#   CONDA_SUBDIR=osx-64 micromamba create -n congen -f environment.yml
#   micromamba activate congen
#   conda config --env --set subdir osx-64
# R and every R package are installed and pinned by conda/micromamba; renv is not used.
# After the first successful solve, re-export a fully pinned, portable lock:
#   micromamba env export -n congen --no-builds | sed '/^prefix:/d' > environment.lock.yml
name: congen
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  # ── workflow engine ──
  - snakemake-minimal
  # ── bioinformatics CLI ──
  - bcftools
  - samtools
  - htslib            # tabix / bgzip
  - vcftools
  - plink
  - plink2
  - admixture
  - pixy
  # ── python analysis + app ──
  - scikit-allel
  - pandas
  - numpy
  - scipy
  - pyarrow           # results_cube.parquet
  - streamlit
  - plotly
  - matplotlib
  # ── R stack (SNPRelate / dartR / hierfstat) ──
  - r-base
  - r-essentials
  - bioconductor-snprelate
  - r-adegenet
  - r-hierfstat
  - r-dartr
  # ── reporting ──
  - quarto
# Built from source (not reliably on bioconda/osx-64): currentNe2, GONE2 — tools/README.md
# NeEstimator v2 is a Java GUI used only as a manual cross-check.
