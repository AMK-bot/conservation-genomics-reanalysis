# config/config.yaml
# ALL filtering thresholds, N_e settings, paths, and the parameter grid live here.
# Nothing in workflow/ hard-codes a threshold — every rule reads it from this file.
# The fragility cube IS this config's parameter grid made executable (plan §5).

project:
  name: congen-reanalysis
  seed: 42

paths:
  data: data                 # symlink to internal SSD ~/Desktop/MMP/congen_data (see data/README.md)
  results: results
  cube: results/cube/results_cube.parquet
  peafowl:
    # Deposited neutral, LD-pruned set -> frozen validation reference only (22 samples, 790,705 SNPs).
    # The workflow re-derives unpruned per-preset Set A for N_e and pruned derivatives for structure.
    set_a_neutral: "data/peafowl/Modern_genomic_dataset_unlinked_neutral/Modern_genomic_dataset_unlinked&neutral.vcf"
    # Set B — all sites, lightly filtered -> diversity (22 samples, 1,139,469 SNPs)
    set_b_all:     "data/peafowl/Modern_genomic_dataset_all/Modern_genomic_dataset_all.vcf"
    # museum <-> modern comparative -> temporal erosion (angle G)
    comparative:   "data/peafowl/raw/Comparative_genomic_dataset_F.vcf.gz"
    reference:     "data/peafowl/pseudochromosomes.no_blank_shortIDname.fasta"
    gff:           "data/peafowl/green_peafowl_genome.all.gff"
    # Phase-1 derived inputs
    popmap:        "config/peafowl_popmap.tsv"          # sample -> population (22 birds)
    autosomes:     "config/peafowl_autosomes.txt"       # 32 chromosome_<int> (Z/W/mito/scaffolds dropped)
    # Shared parent: Modern_all -> bcftools norm -m -any -> biallelic SNPs on autosomes.
    # Set A is re-derived PER PRESET from this (the cube's filter knob); set_a_neutral above is a frozen validation ref only.
    norm_parent:   "data/peafowl/intermediates/modern.norm.bial.auto.vcf.gz"
  wolf:
    # genome-wide all-SNPs (GERP / ROH); 211 samples; BGZF + csi index; INFO/AA polarized (2 outgroups)
    allsnps:    "data/wolf/vcf/Pol.2out.mac2/100S95F14R.chr1-38.allSNPs.wfm.vcf.gz"
    # coding variants with VEP impact -> genetic load
    coding_vep: "data/wolf/vcf/Pol.2out.mac2/100S95F14R.chr1-38.vepfinal.wfm.vcf.gz"
    chrx:       "data/wolf/vcf/Pol.2out.mac2/74Females.chrX.vepfinal.wfm.vcf.gz"
    vep_dir:    "data/wolf/vep/Pol.2out.mac2"
    gerp_dir:   "data/wolf/gerp"
    # GERP RS conservation score per SNP (col5), keyed by bed END == 1-based VCF POS
    gerp_allsnps_bed: "data/wolf/gerp/100S95F14R.chr1-38.allSNPs.rates.unique.bed"
    # deposit's precomputed per-individual load at GERP>4 — the Phase-4 validation anchor + IND/POP source
    load_anchor:      "data/wolf/gerp/LoadPerInd.thres4.100S95F14R.chr1-38.allSNPs.wfm.txt"

# ── Chapter 1: Green peafowl (Pavo muticus) ────────────────────────────────────
peafowl:
  populations: [Yunnan, Vietnam, Thailand]         # Cambodia n=1 dropped (plan §0)

  # QC / filtering → TWO callsets (plan §4):
  #   Set A: neutral, per preset   → unpruned for N_e; LD-pruned derivative for structure
  #   Set B: lightly filtered, no MAF → diversity (Ho/He, allelic richness)
  filtering:
    biallelic_snps_only: true
    hwe_per_population: 1.0e-6
    ld_prune: "50 10 0.1"                           # PLINK --indep-pairwise win step r2
    # "filtering stringency" knob of the fragility cube:
    presets:
      lenient:  {max_missing: 0.7, min_gq: 15, min_dp: 4, mac: 3}
      standard: {max_missing: 0.8, min_gq: 20, min_dp: 6, mac: 3}
      strict:   {max_missing: 0.9, min_gq: 30, min_dp: 8, mac: 3}

  # Set B — diversity callset: lightly filtered, NO MAF/MAC, NO HWE, NO LD-prune
  # (preserves rare alleles for Ho/He + allelic richness; plan §4).
  set_b:
    min_dp: 4
    min_gq: 15
    max_missing: 0.5                                 # keep sites with >=50% genotypes present

  diversity:
    ar_max_sites: 50000                              # random (seeded) thin for hierfstat allelic.richness
                                                     # — memory-bounded on 8 GB; AR is a per-locus mean so a thin is stable

  # Angle G — temporal diversity erosion: museum (kiz*) vs modern, rarefied to equal n.
  # Mirrors Dong et al. 2021's windowed-pi (Nucleotide_diversity_.sh); see deviations re s_9_2->PE125_220.
  temporal:
    museum:  [kiz14594, kiz4651, kiz4652, kiz4653, kiz8252]
    modern:  [s_5, s_6, s_7, s_8, s_9_1, PE125_220]
    rarefy_n: 5                                      # smallest group (museum n=5)
    window_pi: 50000                                 # vcftools --window-pi (authors' value)
    window_pi_step: 20000

  kinship:
    method: king                                    # PLINK2 --make-king / KING
    relatedness_cutoff: 0.0884                       # 2nd-degree; CONFIRMATORY gate — keep published 22 (plan §4)
    structure_preset: standard                       # which filter preset feeds KING / PCA / ADMIXTURE figures

  structure:
    pca_components: 10
    admixture_K: [1, 2, 3, 4, 5]
    admixture_seeds: [1, 2, 3, 4, 5]
    admixture_cv_folds: 10

  ne:
    methods: [currentNe2]                            # automated. NeEstimator-LDNe = manual GUI cross-check; GONE2 = trajectory context
    ldne_pcrit: [0.05, 0.02, 0.01]                   # for the manual NeEstimator-LDNe cross-check
    structure_modes: [per_population, pooled]        # unmodeled structure biases N_e low
    # currentNe2 (the badge): cross-chromosome estimate. UN-pruned Set A is the input (LD-Ne
    # reads N_e *from* LD; pruning destroys the signal — plan §5). Genome size in Morgans = the
    # autosome count -> currentNe2's "no genetic map needed" cross-chromosome mode.
    genome_size_morgans: 32                          # = config/peafowl_autosomes.txt count
    snp_cap: 25000                                   # seeded -s cap. RUNTIME (not RAM) is the limit:
                                                     # currentNe2 pair work is ~quadratic in SNPs and the
                                                     # cross-chrom estimate saturates far below this (~3e8 pairs).
                                                     # Reproducible: the binary is patched to a fixed RNG seed.
    threads: 4
    ci_pct: 90                                       # currentNe2 emits 50% & 90% CIs; the cube stores the 90%
    # GONE2 — recent-trajectory CONTEXT panel only (NOT a cube axis, NOT in the badge; plan §5).
    gone2:
      rec_rate_cm_per_mb: 3.0                        # borrowed generic-bird rate (peafowl has no map) — documented
      genotype_mode: 0                               # -g 0 unphased diploids
      metapopulation: true                           # -x (random sample from equal-size subpops)
      snp_cap: 50000                                 # -s cap (context figure -> keep tractable)
      structure_preset: standard                     # which un-pruned Set A feeds the trajectory
      # GONE2 ABORTS unless EVERY chromosome is 20-1000 cM. At 3 cM/Mb the peafowl
      # microchromosomes fall below 20 cM, so we restrict the trajectory to macrochromosomes
      # whose SNP span is in [min,max] cM (margin above 20 so -s subsampling can't drop them).
      min_chrom_cm: 25
      max_chrom_cm: 1000

# ── GBF indicators (plan §6) ───────────────────────────────────────────────────
gbf:
  ne_threshold: 500            # the N_e > 500 genetic-diversity indicator
  nc_proxy_threshold: 5000     # census-size proxy (N_c) contrast = ne_threshold / ne_nc_ratio
  ne_nc_ratio: 0.1             # conservative vertebrate N_e:N_c (Frankham) -> N_e=500 <-> N_c=5000
  # Documented census for the N_c contrast (plan §6). Range-wide N_c nominally exceeds 5000, BUT
  # that is the WRONG denominator for a PER-population indicator: the species is fragmented into
  # subpopulations far below it (e.g. Keo Seima, Cambodia ~745) -> expected per-pop N_e << 500,
  # and the measured genomic N_e is lower still. The N_e:N_c gap is the conservation signal.
  census:
    peafowl:
      n_mature_low:  10000     # mature individuals, range-wide
      n_mature_high: 19999
      iucn_category: EN        # Endangered, trend decreasing
      source: "IUCN Red List / BirdLife International 2018 (Pavo muticus)"

# ── The fragility cube: filter × Ne-method × structure (plan §5) ───────────────
cube:
  filter_presets: [lenient, standard, strict]
  ne_methods: [currentNe2]   # only automated axis (the app reads cube["ne_method"].unique()); NeEstimator = manual cross-check
  structure_modes: [per_population, pooled]

# ── Chapter 2: Scandinavian wolf (Canis lupus) ─────────────────────────────────
# 12 GB deposit; CLI-streaming-first, per-chromosome — never load whole VCF into RAM.
wolf:
  n_autosomes: 38                   # chr 1-38 (contigs are integer-named); chrX handled separately
  roh:
    caller: bcftools_roh
    long_roh_threshold_mb: 1.5      # long (recent) vs short (ancient) ROH
    gt_error_phred: 30              # bcftools roh -G (assumed genotype error when calling from GTs)
    rec_rate_per_bp: 1.0e-8         # documented constant ~1 cM/Mb (wolf has no dense map) — bcftools roh --rec-rate
    length_cutoffs_mb: [0.1, 0.5, 1.0, 1.5, 2.0]   # the ROH-length sensitivity knob (F_ROH per cutoff)
  load:
    impact_classes: [HIGH, MODERATE, LOW]   # VEP consequence classes
    gerp_threshold: 4.0                       # default = source value (Smeds & Ellegren 2022, GERP>4)
    gerp_sensitivity: [2.0, 3.0, 4.0]         # wolf-load GERP sensitivity axis (decision O4); default 4.0
    polarize_with_outgroup: true
    generations: 5                            # ~5 inbreeding generations tracked
