<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560"
     role="img" aria-labelledby="title description">
  <title id="title">Project journey from public genomes to bounded conservation decisions</title>
  <desc id="description">A chronological diagram. Public green peafowl and Scandinavian wolf
  genome deposits enter model-specific workflows. Peafowl variants are routed differently for
  structure, diversity, and linkage-disequilibrium effective-size models. Wolf data first reproduce
  a deposited GERP load result, then enter load and runs-of-homozygosity sensitivity models. Findings
  generate new stress tests, which end in supported, corrected, indeterminate, or deferred claims.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52736c"/>
    </marker>
    <style>
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #173b36; }
      .kicker { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2e7567; letter-spacing: 1.2px; }
      .head { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #173b36; }
      .body { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #36534d; }
      .small { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #536b66; }
      .number { font: 750 29px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .card { fill: #ffffff; stroke: #b8cbc6; stroke-width: 2; }
      .peafowl { fill: #e8f3ef; stroke: #6ea99b; stroke-width: 2; }
      .wolf { fill: #f7efe4; stroke: #c28a43; stroke-width: 2; }
      .arrow { fill: none; stroke: #52736c; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="560" rx="28" fill="#f4f7f5"/>
  <text class="title" x="64" y="58">The research logic changed when each model met its assumptions</text>
  <text class="kicker" x="66" y="91">PROJECT-WIDE CHRONOLOGY · QUESTION → ROUTING → TEST → CORRECTION → BOUNDED VERDICT</text>

  <g role="group" aria-label="Step one, begin with a verdict question">
    <rect class="card" x="56" y="126" width="320" height="320" rx="22"/>
    <circle cx="96" cy="167" r="23" fill="#2e7567"/>
    <text class="number" x="96" y="178" text-anchor="middle">1</text>
    <text class="head" x="132" y="174">Begin with the question</text>
    <text class="body" x="82" y="220">Can a conservation conclusion survive</text>
    <text class="body" x="82" y="246">defensible analyst choices?</text>
    <rect class="peafowl" x="82" y="282" width="126" height="74" rx="14"/>
    <text class="head" x="145" y="311" text-anchor="middle">22 peafowl</text>
    <text class="small" x="145" y="338" text-anchor="middle">3 regional samples</text>
    <rect class="wolf" x="222" y="282" width="126" height="74" rx="14"/>
    <text class="head" x="285" y="311" text-anchor="middle">211 wolves</text>
    <text class="small" x="285" y="338" text-anchor="middle">8 cohorts</text>
    <text class="small" x="82" y="398">Public deposits; no new field sampling.</text>
  </g>

  <path class="arrow" d="M 376 286 L 425 286"/>

  <g role="group" aria-label="Step two, route data to model-specific inputs">
    <rect class="card" x="428" y="126" width="348" height="320" rx="22"/>
    <circle cx="468" cy="167" r="23" fill="#2e7567"/>
    <text class="number" x="468" y="178" text-anchor="middle">2</text>
    <text class="head" x="504" y="174">Route by model</text>
    <rect class="peafowl" x="454" y="205" width="296" height="103" rx="14"/>
    <text class="head" x="476" y="235">Peafowl</text>
    <text class="body" x="476" y="263">LD-pruned → PCA / ADMIXTURE</text>
    <text class="body" x="476" y="288">Unpruned → LD-based currentNe2</text>
    <rect class="wolf" x="454" y="324" width="296" height="82" rx="14"/>
    <text class="head" x="476" y="353">Wolf</text>
    <text class="body" x="476" y="380">GERP load anchor → ROH sensitivity</text>
  </g>

  <path class="arrow" d="M 776 286 L 825 286"/>

  <g role="group" aria-label="Step three, let results generate new questions">
    <rect class="card" x="828" y="126" width="348" height="320" rx="22"/>
    <circle cx="868" cy="167" r="23" fill="#a56a24"/>
    <text class="number" x="868" y="178" text-anchor="middle">3</text>
    <text class="head" x="904" y="174">Let results challenge us</text>
    <text class="body" x="854" y="222">• Point estimate or interval decision?</text>
    <text class="body" x="854" y="255">• Temporal signal or damage / geography?</text>
    <text class="body" x="854" y="288">• More samples, or still unresolved?</text>
    <text class="body" x="854" y="321">• Proxy coupling or GERP-specific signal?</text>
    <text class="body" x="854" y="354">• Genome-wide association or localization?</text>
    <text class="small" x="854" y="401">Each question received a predeclared test.</text>
  </g>

  <path class="arrow" d="M 1176 286 L 1225 286"/>

  <g role="group" aria-label="Step four, land on bounded evidence states">
    <rect class="card" x="1228" y="126" width="316" height="320" rx="22"/>
    <circle cx="1268" cy="167" r="23" fill="#173b36"/>
    <text class="number" x="1268" y="178" text-anchor="middle">4</text>
    <text class="head" x="1304" y="174">Report evidence states</text>
    <rect x="1254" y="210" width="126" height="48" rx="13" fill="#dceee8"/>
    <text class="head" x="1317" y="241" text-anchor="middle">SUPPORT</text>
    <rect x="1392" y="210" width="126" height="48" rx="13" fill="#f7ead7"/>
    <text class="head" x="1455" y="241" text-anchor="middle">CORRECT</text>
    <rect x="1254" y="274" width="126" height="48" rx="13" fill="#e8eef2"/>
    <text class="head" x="1317" y="305" text-anchor="middle">UNRESOLVED</text>
    <rect x="1392" y="274" width="126" height="48" rx="13" fill="#f0e8f2"/>
    <text class="head" x="1455" y="305" text-anchor="middle">DEFER</text>
    <text class="body" x="1254" y="363">Every headline carries uncertainty,</text>
    <text class="body" x="1254" y="388">a falsifier, and a causal boundary.</text>
  </g>

  <rect x="56" y="478" width="1488" height="48" rx="15" fill="#173b36"/>
  <text x="800" y="510" text-anchor="middle"
        style="font: 700 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#ffffff">
    A successful command was never enough: the biological transformation and decision had to reconcile.
  </text>
</svg>
