<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600"
     role="img" aria-labelledby="title description">
  <title id="title">Wolf load and runs-of-homozygosity model from reproduction to new hypotheses</title>
  <desc id="description">Polarized wolf variants join GERP conservation scores. Homozygous-derived
  GERP-weighted burden defines realized load and heterozygous-derived burden defines masked load.
  The source GERP greater than four result is reproduced for 211 wolves before expanding to three
  GERP thresholds. Runs of homozygosity are summarized at five minimum lengths. A three-by-five
  sensitivity surface then generates three secondary hypotheses: individual association beyond
  generic homozygosity, spatial enrichment inside long ROH, and independent annotation triangulation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b644e"/>
    </marker>
    <style>
      .title { font: 700 31px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #173b36; }
      .kicker { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #a56a24; letter-spacing: 1.1px; }
      .head { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #173b36; }
      .body { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #36534d; }
      .small { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #536b66; }
      .metric { font: 750 29px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #173b36; }
      .mono { font: 700 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #173b36; }
      .card { fill: #ffffff; stroke: #c9c1ad; stroke-width: 2; }
      .input { fill: #f7efe4; stroke: #c28a43; stroke-width: 2; }
      .support { fill: #e5f1ed; stroke: #6ea99b; stroke-width: 2; }
      .question { fill: #eef3f5; stroke: #7c9aa5; stroke-width: 2; }
      .arrow { fill: none; stroke: #6b644e; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="600" rx="28" fill="#f7f5f0"/>
  <text class="title" x="58" y="55">Wolf: reproduce the source anchor before extending the model</text>
  <text class="kicker" x="60" y="88">POLARIZATION → GERP-WEIGHTED LOAD → ROH SENSITIVITY → SECONDARY HYPOTHESES</text>

  <g role="group" aria-label="Polarized variant inputs">
    <rect class="input" x="54" y="126" width="260" height="168" rx="19"/>
    <text class="head" x="79" y="163">Polarized wolf variants</text>
    <text class="metric" x="79" y="206">211 wolves</text>
    <text class="body" x="79" y="236">ancestral allele + GERP score</text>
    <text class="small" x="79" y="267">8 cohorts · assayed SNP records</text>
  </g>

  <path class="arrow" d="M 314 210 L 369 210"/>

  <g role="group" aria-label="Load definitions">
    <rect class="card" x="373" y="112" width="376" height="196" rx="20"/>
    <text class="head" x="398" y="149">GERP-weighted load proxies</text>
    <rect x="398" y="173" width="326" height="48" rx="11" fill="#f7ead7"/>
    <text class="body" x="414" y="203"><tspan font-weight="700">Realized</tspan> = homozygous-derived burden / calls</text>
    <rect x="398" y="231" width="326" height="48" rx="11" fill="#e8eef2"/>
    <text class="body" x="414" y="261"><tspan font-weight="700">Masked</tspan> = heterozygous-derived burden / calls</text>
    <text class="small" x="398" y="297">Predicted-impact proxies—not measured harm</text>
  </g>

  <path class="arrow" d="M 749 210 L 804 210"/>

  <g role="group" aria-label="Exact source reproduction">
    <rect class="support" x="808" y="112" width="324" height="196" rx="20"/>
    <text class="head" x="833" y="149">Source anchor: GERP &gt; 4</text>
    <text class="metric" x="833" y="195">211/211</text>
    <text class="body" x="833" y="225">raw count deltas = 0</text>
    <text class="body" x="833" y="251">p95 relative error = 1.29 × 10⁻¹⁴</text>
    <text class="small" x="833" y="286">Fidelity first; not a novelty claim</text>
  </g>

  <path class="arrow" d="M 1132 210 L 1187 210"/>

  <g role="group" aria-label="Three by five sensitivity surface">
    <rect class="card" x="1191" y="112" width="354" height="196" rx="20"/>
    <text class="head" x="1216" y="149">Sensitivity surface</text>
    <text class="metric" x="1216" y="193">3 GERP × 5 ROH</text>
    <text class="body" x="1216" y="223">GERP &gt; 2, 3, 4</text>
    <text class="body" x="1216" y="248">ROH ≥ 0.1, 0.5, 1, 1.5, 2 Mb</text>
    <text class="small" x="1216" y="276">5 cohorts: realized &gt; masked</text>
    <text class="small" x="1216" y="295">3 cohorts: realized ≤ masked</text>
  </g>

  <path class="arrow" d="M 1368 308 L 1368 357"/>

  <g role="group" aria-label="Questions generated by the wolf baseline">
    <rect class="question" x="55" y="355" width="1490" height="182" rx="22"/>
    <text class="head" x="82" y="391">The validated baseline generated three gated hypotheses</text>

    <rect x="82" y="414" width="438" height="93" rx="14" fill="#ffffff" stroke="#b8cbc6"/>
    <text class="head" x="104" y="445">1 · Individual association</text>
    <text class="body" x="104" y="472">Does F_ROH track realized load within cohort</text>
    <text class="body" x="104" y="495">after controlling generic homozygosity?</text>

    <rect x="581" y="414" width="438" height="93" rx="14" fill="#ffffff" stroke="#b8cbc6"/>
    <text class="head" x="603" y="445">2 · Spatial localization</text>
    <text class="body" x="603" y="472">Is burden per eligible SNP-genotype call</text>
    <text class="body" x="603" y="495">enriched inside long ROH beyond a spatial null?</text>

    <rect x="1080" y="414" width="438" height="93" rx="14" fill="#ffffff" stroke="#b8cbc6"/>
    <text class="head" x="1102" y="445">3 · Independent triangulation</text>
    <text class="body" x="1102" y="472">Do genuinely independent annotation definitions</text>
    <text class="body" x="1102" y="495">add evidence beyond the source study?</text>
  </g>

  <rect x="55" y="554" width="1490" height="28" rx="9" fill="#173b36"/>
  <text x="800" y="574" text-anchor="middle"
        style="font: 700 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#ffffff">
    Reproduction validated the implementation; only predeclared controls and null models could support an extension.
  </text>
</svg>
